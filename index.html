@media(min-width:651px){.map-topbar{grid-template-columns:minmax(280px,1fr) auto;align-items:start}.map-actions{display:flex;width:auto;gap:8px}.map-actions .filter-wrap{width:auto}.map-actions button{width:auto}.map-topbar input{max-width:520px}}

</style></head><body>
<header id="header"><h1>JET Brasília — Monitor Operacional</h1><div class="sub">Dados dos endpoints do mapa JET • atualização automática a cada 60s</div><div class="controls"><button id="r">↻ Atualizar</button><select id="f"><option value="all">Todos</option><option value="monitor" selected>Monitorados</option><option value="monitor-zero">Monitor zerados</option></select><input id="q" placeholder="Buscar ponto"></div></header>
<main><div id="map"></div><div class="map-topbar"><div class="search-box"><input id="mapSearch" autocomplete="off" inputmode="search" placeholder="🔎 Buscar estacionamento..."><div id="searchSuggestions" class="search-suggestions"></div></div><div class="map-actions"><div class="filter-wrap"><button id="filterBtn">⚙️ Filtros</button><div id="filterMenu" class="filter-menu"><button data-filter="all">📍 Todos os estacionamentos</button><button data-filter="monitor" class="active">🟡 Estacionamentos do monitor</button><button data-filter="monitor-zero">🔴 Monitor zerados</button></div></div><button id="themeBtn">☀️ Dark</button><button id="infoBtn">☷ Info</button></div></div><section id="infoPanel"><div class="cards"><div class="card"><div class="label">ESTACIONAMENTOS</div><div class="value" id="p">—</div></div><div class="card"><div class="label">PATINETES</div><div class="value" id="b">—</div></div><div class="card"><div class="label">SEM PATINETES</div><div class="value" id="z">—</div></div><div class="card"><div class="label">MONITORADOS</div><div class="value" id="m">—</div></div><div class="card"><div class="label">BATERIA MÉDIA</div><div class="value" id="bat">—</div></div></div><div class="tables"><div class="box"><b>Pontos de atenção</b><table><thead><tr><th>Ponto</th><th>Qtd.</th><th>Meta</th><th>Status</th></tr></thead><tbody id="att"></tbody></table></div><div class="box"><b>Patinetes com bateria &lt; 30%</b><table><thead><tr><th>Patinete</th><th>Bateria</th><th>Status</th></tr></thead><tbody id="lb"></tbody></table></div></div><div class="sub" id="s" style="padding:10px 0">Carregando...</div></section></main>
<script src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js"></script><script>
const C="6787b812c168def1b2c6d143",B="https://logistic.gojet.app/api/v0/urent";
let map, P=[], S=[], markers=[], bikesLoaded=false, userMarker=null, userWatchId=null, firstUserFix=true;

const blankStyle={
  version:8,
  sources:{
    osm:{type:"raster",tiles:["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],tileSize:256,attribution:"© OpenStreetMap contributors"}
  },
  layers:[
    {id:"osm",type:"raster",source:"osm",paint:{
      "raster-saturation":0.15,
      "raster-contrast":0.08,
      "raster-brightness-min":0.08,
      "raster-brightness-max":0.92,
      "raster-opacity":0.92
    }}
  ]
};

function initMap(){
  map=new maplibregl.Map({
    container:"map",
    style:blankStyle,
    center:[-47.89,-15.79],
    zoom:11.8,
    bearing:0,
    pitch:0,
    attributionControl:false,
    dragRotate:true,
    touchZoomRotate:true
  });
  map.addControl(new maplibregl.NavigationControl({showCompass:true,showZoom:true,visualizePitch:true}),"bottom-right");
  map.addControl(new maplibregl.AttributionControl({compact:true}),"bottom-left");

  // Botões rápidos de rotação.
  const rot=document.createElement("div");
  rot.className="rotate-tools";
  rot.innerHTML='<button id="rotL" title="Girar para a esquerda">↺</button><button id="north" title="Voltar para o norte">N</button><button id="rotR" title="Girar para a direita">↻</button>';
  document.getElementById("map").appendChild(rot);
  document.getElementById("rotL").onclick=()=>map.easeTo({bearing:map.getBearing()-30,duration:250});
  document.getElementById("rotR").onclick=()=>map.easeTo({bearing:map.getBearing()+30,duration:250});
  document.getElementById("north").onclick=()=>map.easeTo({bearing:0,pitch:0,duration:350});

  const loc=document.createElement("div");
  loc.className="location-tools";
  loc.innerHTML='<button id="myLocation" title="Mostrar minha localização">⌾</button>';
  document.getElementById("map").appendChild(loc);
  document.getElementById("myLocation").onclick=()=>requestLocation(true);

  map.on("load",()=>{render(); requestLocation(false);});
  map.on("moveend",()=>render());
  map.on("zoomend",()=>render());
}

async function all(x){
  let a=await fetch(`${B}/${x}?city_id=${C}&page=1&limit=1000`,{cache:"no-store"}).then(r=>r.json()),v=a.entries||[];
  for(let i=2;i<=+a.total_pages;i++)
    v=v.concat((await fetch(`${B}/${x}?city_id=${C}&page=${i}&limit=1000`,{cache:"no-store"}).then(r=>r.json())).entries||[]);
  return v
}

function stat(x){
  const n=+x.bikes_count||0,t=+x.target_bikes_count||0;
  // Prioridade: monitor zerado > 1 patinete > abaixo da meta > meta atingida/superada.
  if(x.monitor && n===0)return["Vazio — prioridade máxima","bad"];
  if(n===1)return["1 patinete — prioridade","orange"];
  if(t>0 && n<t)return["Abaixo da meta","warn"];
  if(t>0 && n>=t)return["Meta atingida","ok"];
  if(n===0)return["Vazio","warn"];
  return["OK","ok"]
}

function clearMarkers(){
  markers.forEach(m=>m.remove());
  markers=[];
}

function render(){
  if(!map || !map.loaded()) return;
  clearMarkers();

  const f=document.getElementById("f").value,q=document.getElementById("q").value.toLowerCase();

  // Não limitar os marcadores aos limites atuais do mapa.
  // Isso evita que pontos desapareçam ao abrir, arrastar ou alterar o zoom.
  // O filtro controla exatamente quais estacionamentos são desenhados.
  const visible=P.filter(x=>{
    let n=+x.bikes_count||0,t=+x.target_bikes_count||0;
    if(q&&!String(x.name).toLowerCase().includes(q))return false;
    if(f=="monitor"&&!x.monitor)return false;
    if(f=="monitor-zero"&&!(x.monitor&&n===0))return false;
    if(x.latitude==null||x.longitude==null)return false;
    return true;
  });
  visible.forEach(x=>{
    if(x.latitude==null)return;
    let [st,cl]=stat(x);
    const color=cl==="bad"?"#ff3b30":cl==="orange"?"#ff9500":cl==="warn"?"#ffc857":"#21d19a";
    const el=document.createElement("div");
    el.className="jet-marker";
    el.style.background=color;
    el.innerHTML=`<span>${x.bikes_count||0}</span>`;
    const lat=Number(x.latitude), lng=Number(x.longitude);
    const googleUrl=`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
    const wazeUrl=`https://waze.com/ul?ll=${lat}%2C${lng}&navigate=yes`;
    const popup=new maplibregl.Popup({offset:16,maxWidth:"330px"}).setHTML(
      `<div class="popup parking-popup">
        <div class="popup-title">${x.name}</div>
        <div class="popup-row">🛴 <b>${x.bikes_count||0}</b> patinetes &nbsp; • &nbsp; 🎯 Meta: <b>${x.target_bikes_count??"—"}</b></div>
        <div class="popup-status ${cl}">${st}</div>
        <div class="popup-update">Última atualização: ${x.bc_updated_at||"—"}</div>
        <div class="popup-nav">
          <a class="nav-btn google" href="${googleUrl}" target="_blank" rel="noopener">🗺️ Google Maps</a>
          <a class="nav-btn waze" href="${wazeUrl}" target="_blank" rel="noopener">🚗 Waze</a>
        </div>
        <button class="parking-guide-btn" type="button" onclick="this.nextElementSibling.classList.toggle('open');this.textContent=this.nextElementSibling.classList.contains('open')?'📷 Ocultar como estacionar':'📷 Como estacionar?'">📷 Como estacionar?</button>
        <div class="parking-guide"><img src="como-estacionar.jpg" alt="Exemplo de como estacionar o patinete"></div>
      </div>`
    );
    const marker=new maplibregl.Marker({element:el,anchor:"center",rotationAlignment:"map"})
      .setLngLat([x.longitude,x.latitude]).setPopup(popup).addTo(map);
    marker.__parkingId=x.id;
    markers.push(marker);
  });

  let a=P.filter(x=>(+x.bikes_count||0)==0||((+x.target_bikes_count||0)>0&&(+x.bikes_count||0)<(+x.target_bikes_count||0)))
    .sort((a,b)=>(+a.bikes_count||0)-(+b.bikes_count||0)).slice(0,100);

  document.getElementById("att").innerHTML=a.map(x=>{
    let [st,cl]=stat(x);
    return `<tr><td>${x.name}</td><td>${x.bikes_count||0}</td><td>${x.target_bikes_count??"—"}</td><td class="${cl}">${st}</td></tr>`
  }).join("");

  let l=S.filter(x=>(+x.battery_percent)<.3).sort((a,b)=>a.battery_percent-b.battery_percent).slice(0,100);
  document.getElementById("lb").innerHTML=l.map(x=>
    `<tr><td>${x.identifier||x.name}</td><td class="bad">${Math.round(x.battery_percent*100)}%</td><td>${x.business_status||"—"}</td></tr>`
  ).join("")||"<tr><td colspan=3>Nenhum registro.</td></tr>";
}
function updateUserLocation(pos,center=false){
  const {latitude,longitude,accuracy}=pos.coords;
  const el=userMarker?userMarker.getElement():document.createElement("div");
  if(!userMarker){
    el.className="location-marker";
    userMarker=new maplibregl.Marker({element:el,anchor:"center",rotationAlignment:"map"}).setLngLat([longitude,latitude]).addTo(map);
  }else userMarker.setLngLat([longitude,latitude]);
  const btn=document.getElementById("myLocation");
  if(btn) btn.title=`Minha localização • precisão aproximada ${Math.round(accuracy||0)} m`;
  if(center && map){ map.easeTo({center:[longitude,latitude],zoom:Math.max(map.getZoom(),15),duration:500}); }
}
function locationError(err){
  const btn=document.getElementById("myLocation");
  const msg=err.code===1?"Permita a localização do navegador para acompanhar o auxiliar. Se o navegador bloquear localização em arquivo local, abra o app por HTTPS.":"Não foi possível obter a localização. Toque novamente no botão de localização.";
  if(btn) btn.title=msg;
  const status=document.getElementById("s");
  if(status && !P.length) status.textContent=msg;
}
function requestLocation(center){
  if(!navigator.geolocation){locationError({code:2});return;}
  navigator.geolocation.getCurrentPosition(pos=>{updateUserLocation(pos,center||firstUserFix);firstUserFix=false},locationError,{enableHighAccuracy:true,maximumAge:10000,timeout:10000});
  if(userWatchId===null){
    userWatchId=navigator.geolocation.watchPosition(pos=>{updateUserLocation(pos,false);firstUserFix=false},locationError,{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
  }
}

async function load(){try{
  // O modo operacional padrão é Monitor.
  document.getElementById("f").value="monitor";
  if(typeof filterMenu!=="undefined") filterMenu.querySelectorAll("button[data-filter]").forEach(b=>b.classList.toggle("active",b.dataset.filter==="monitor"));
  if(typeof filterBtn!=="undefined") filterBtn.textContent="🟡 Monitor";
  P=await all("parkings");
  document.getElementById("p").textContent=P.length.toLocaleString("pt-BR");
  document.getElementById("z").textContent=P.filter(x=>(+x.bikes_count||0)==0).length.toLocaleString("pt-BR");
  document.getElementById("m").textContent=P.filter(x=>x.monitor).length.toLocaleString("pt-BR");
  render();
  document.getElementById("s").textContent="Mapa carregado — dados de patinetes serão consultados quando necessários.";
}catch(e){document.getElementById("s").textContent="Erro ao consultar a API: "+e.message}}

async function loadBikes(){if(bikesLoaded)return; try{S=await all("bikes");bikesLoaded=true;document.getElementById("b").textContent=S.length.toLocaleString("pt-BR");let v=S.map(x=>+x.battery_percent).filter(Number.isFinite);document.getElementById("bat").textContent=v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*100)+"%":"—";render();}catch(e){document.getElementById("s").textContent="Erro ao consultar patinetes: "+e.message}}
initMap();
document.getElementById("r").onclick=load;document.getElementById("f").onchange=()=>{const v=document.getElementById("f").value;filterMenu.querySelectorAll("button[data-filter]").forEach(b=>b.classList.toggle("active",b.dataset.filter===v));filterBtn.textContent=v==="all"?"⚙️ Filtros":v==="monitor"?"🟡 Monitor":"🔴 Monitor zerados";render();};document.getElementById("q").oninput=render;load();setInterval(load,60000);
</script>
<script>
const themeBtn=document.getElementById("themeBtn"),infoBtn=document.getElementById("infoBtn"),infoPanel=document.getElementById("infoPanel"),mapSearch=document.getElementById("mapSearch"),searchSuggestions=document.getElementById("searchSuggestions"),filterBtn=document.getElementById("filterBtn"),filterMenu=document.getElementById("filterMenu"),filterWrap=document.querySelector(".filter-wrap");

// Impede o zoom do navegador no celular, sem bloquear o zoom/gestos do mapa.
document.addEventListener("dblclick",e=>{if(!e.target.closest("#map"))e.preventDefault()},{passive:false});
document.addEventListener("gesturestart",e=>{if(!e.target.closest("#map"))e.preventDefault()},{passive:false});
document.addEventListener("gesturechange",e=>{if(!e.target.closest("#map"))e.preventDefault()},{passive:false});
document.addEventListener("gestureend",e=>{if(!e.target.closest("#map"))e.preventDefault()},{passive:false});
filterBtn.onclick=()=>filterMenu.classList.toggle("open");
filterMenu.querySelectorAll("button[data-filter]").forEach(btn=>btn.onclick=()=>{document.getElementById("f").value=btn.dataset.filter;filterMenu.querySelectorAll("button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");filterBtn.textContent=btn.dataset.filter==="all"?"⚙️ Filtros":btn.dataset.filter==="monitor"?"🟡 Monitor":"🔴 Monitor zerados";filterMenu.classList.remove("open");render();});
document.addEventListener("click",e=>{if(filterWrap&&!filterWrap.contains(e.target))filterMenu.classList.remove("open")});
themeBtn.onclick=()=>{
  document.body.classList.toggle("dark");
  const dark=document.body.classList.contains("dark");
  themeBtn.textContent=dark?"☀️ Claro":"🌙 Dark";
  localStorage.setItem("jetTheme",dark?"dark":"light");
};
if(localStorage.getItem("jetTheme")==="dark"){document.body.classList.add("dark");themeBtn.textContent="☀️ Claro"}else themeBtn.textContent="🌙 Dark";
infoBtn.onclick=()=>{infoPanel.classList.toggle("open"); if(infoPanel.classList.contains("open")){loadBikes(); infoPanel.scrollIntoView({behavior:"smooth"});}};
mapSearch.oninput=()=>{
  const q=mapSearch.value.toLowerCase().trim();
  searchSuggestions.innerHTML="";
  if(!q){searchSuggestions.classList.remove("open");render();return}
  const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const nq=norm(q);
  const hits=P.filter(x=>norm(x.name).includes(nq)||norm(x.region).includes(nq)).slice(0,8);
  hits.forEach(x=>{
    const b=document.createElement("button");
    b.innerHTML=`<strong>${x.name}</strong><small>${x.region||"Brasília"}</small>`;
    b.onclick=()=>{
      mapSearch.value=x.name; searchSuggestions.classList.remove("open");
      if(map) map.flyTo({center:[x.longitude,x.latitude],zoom:17,duration:700});
      const marker=markers.find(m=>m.__parkingId===x.id); if(marker) marker.openPopup();
    };
    searchSuggestions.appendChild(b);
  });
  if(hits.length) searchSuggestions.classList.add("open");
};
document.addEventListener("click",e=>{if(!e.target.closest(".search-box")) searchSuggestions.classList.remove("open")});
</script>
