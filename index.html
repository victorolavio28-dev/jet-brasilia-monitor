<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script><script>
const C="6787b812c168def1b2c6d143",B="https://logistic.gojet.app/api/v0/urent";
let scootersVisible=false, bikesRequest=null, scooterPopup=null, bikesUpdatedAt=0;
const scooterSourceVersions=new WeakMap();
let scooterData={type:"FeatureCollection",features:[]};
let map, P=[], S=[], markers=[], bikesLoaded=false, userMarker=null, userWatchId=null, firstUserFix=true;
let allowedGeometry=null, basePaints=new Map();
let techzoneGeoJSON={type:"FeatureCollection",features:[]}, techzoneMask=null, techzoneCount=0;

// Base cartográfica vetorial com equilíbrio entre detalhe e limpeza visual.
// No modo claro usamos Liberty para preservar parques verdes e água azul.
// Depois do carregamento, as vias são clareadas para recuperar o visual de ruas brancas.
function baseMapStyle(dark=false){
  return dark
    ? "https://tiles.openfreemap.org/styles/dark"
    : "https://tiles.openfreemap.org/styles/liberty";
}

function tuneBaseMap(dark=false){
  if(!map)return;
  const style=map.getStyle();
  if(!style || !Array.isArray(style.layers))return;

  // Mantém as cores naturais do Liberty (parques/vegetação verdes e água azul),
  // mas neutraliza o amarelo/laranja das vias para um mapa mais clean.
  style.layers.forEach(layer=>{
    try{
      if(layer.id.startsWith("jet-"))return;
      if(!basePaints.has(layer.id))basePaints.set(layer.id,{paint:{...layer.paint},filter:layer.filter});
      const original=basePaints.get(layer.id);
      if(allowedGeometry && layer.type==="fill-extrusion"){
        const inside=["within",allowedGeometry];
        map.setFilter(layer.id,original.filter?["all",original.filter,inside]:inside);
      }
      if(allowedGeometry && (layer.type==="fill" || layer.type==="background")){
        const key=layer.type+"-color", color=original.paint[key];
        const gray=dark?"#343a40":"#e1e4e7";
        if(layer.type==="fill" && color!==undefined)
          map.setPaintProperty(layer.id,key,["case",["within",allowedGeometry],color,gray]);
      }
      if(layer.type!=="line" || dark)return;
      const id=String(layer.id||"").toLowerCase();
      const sourceLayer=String(layer["source-layer"]||"").toLowerCase();
      const looksLikeRoad=/road|street|highway|motorway|trunk|primary|secondary|tertiary|residential|service|living|pedestrian|bridge|tunnel/.test(id);
      const transportRoad=sourceLayer==="transportation" && !/rail|tram|subway|ferry|runway|aeroway/.test(id);
      if(!looksLikeRoad && !transportRoad)return;

      const casing=/casing|outline|border/.test(id);
      map.setPaintProperty(layer.id,"line-color",casing?"#d8dde2":"#ffffff");
      map.setPaintProperty(layer.id,"line-opacity",1);
    }catch(_){}
  });
}

function ringArea(ring){
  let a=0;
  for(let i=0;i<ring.length-1;i++) a+=ring[i][0]*ring[i+1][1]-ring[i+1][0]*ring[i][1];
  return a/2;
}
function orientRing(ring,wantCCW){
  const isCCW=ringArea(ring)>0;
  return isCCW===wantCCW?ring:ring.slice().reverse();
}
function closeRing(ring){
  if(!ring.length)return ring;
  const a=ring[0],b=ring[ring.length-1];
  return a[0]===b[0]&&a[1]===b[1]?ring:ring.concat([[a[0],a[1]]]);
}

function buildTechzoneMask(rings){
  // Une primeiro todas as Techzones. Isso evita o efeito de "duplo furo":
  // quando duas zonas se sobrepõem, a interseção não pode voltar a ficar vermelha.
  const outer=orientRing(closeRing([[-49.7,-17.2],[-46.8,-17.2],[-46.8,-14.8],[-49.7,-14.8],[-49.7,-17.2]]),true);
  if(!rings.length)return null;

  try{
    if(typeof turf==="undefined" || typeof turf.union!=="function") throw new Error("Turf indisponível");

    let merged=turf.polygon([orientRing(closeRing(rings[0]),true)]);
    for(let i=1;i<rings.length;i++){
      const poly=turf.polygon([orientRing(closeRing(rings[i]),true)]);
      const next=turf.union(merged,poly);
      if(next)merged=next;
    }

    const g=merged && merged.geometry;
    if(!g)return null;

    // A máscara é um grande retângulo com a UNIÃO das áreas permitidas como furos.
    // Assim, mesmo em zoom alto ou em regiões onde Techzones se encostam/sobrepõem,
    // a área permitida continua transparente e não recebe o vermelho externo.
    const allowedOuters=[];
    if(g.type==="Polygon"){
      if(g.coordinates && g.coordinates[0]) allowedOuters.push(g.coordinates[0]);
    }else if(g.type==="MultiPolygon"){
      (g.coordinates||[]).forEach(poly=>{ if(poly && poly[0]) allowedOuters.push(poly[0]); });
    }

    const holes=allowedOuters
      .map(r=>orientRing(closeRing(r),false))
      .filter(r=>r.length>=4);

    if(!holes.length)return null;
    return {type:"Feature",properties:{},geometry:{type:"Polygon",coordinates:[outer,...holes]}};
  }catch(e){
    console.warn("Não foi possível unir as Techzones; a máscara externa será ocultada para evitar áreas vermelhas incorretas.",e);
    return null;
  }
}

function renderTechzones(){
  if(!map)return;
  const style=map.getStyle();
  if(!style || !Array.isArray(style.layers))return;
  const dark=document.body.classList.contains("dark");

  if(map.getSource("jet-techzones")) map.getSource("jet-techzones").setData(techzoneGeoJSON);
  else map.addSource("jet-techzones",{type:"geojson",data:techzoneGeoJSON});

  if(techzoneMask){
    if(map.getSource("jet-outside-mask")) map.getSource("jet-outside-mask").setData(techzoneMask);
    else map.addSource("jet-outside-mask",{type:"geojson",data:techzoneMask});

    if(!map.getLayer("jet-outside-mask")) map.addLayer({
      id:"jet-outside-mask",type:"fill",source:"jet-outside-mask",
      paint:{"fill-color":dark?"#a91525":"#ef4055","fill-opacity":dark?.14:.075}
    });
    else {
      map.setLayoutProperty("jet-outside-mask","visibility","visible");
      map.setPaintProperty("jet-outside-mask","fill-color",dark?"#a91525":"#ef4055");
      map.setPaintProperty("jet-outside-mask","fill-opacity",dark?.14:.075);
    }
  }else if(map.getLayer("jet-outside-mask")){
    map.setLayoutProperty("jet-outside-mask","visibility","none");
  }

  if(!map.getLayer("jet-zone-fill")) map.addLayer({
    id:"jet-zone-fill",type:"fill",source:"jet-techzones",
    paint:{"fill-color":dark?"#ffffff":"#ffffff","fill-opacity":0}
  });
  else map.setPaintProperty("jet-zone-fill","fill-opacity",0);

  const zoneWidth=dark
    ? ["interpolate",["linear"],["zoom"],9,1,14,1.6,18,2.1]
    : ["interpolate",["linear"],["zoom"],9,.8,14,1.35,18,1.8];
  if(!map.getLayer("jet-zone-line")) map.addLayer({
    id:"jet-zone-line",type:"line",source:"jet-techzones",layout:{"line-join":"round","line-cap":"round"},
    paint:{"line-color":dark?"#ff5267":"#df3348","line-width":zoneWidth,"line-opacity":dark?.85:.78}
  });
  else {
    map.setLayoutProperty("jet-zone-line","visibility","visible");
    map.setPaintProperty("jet-zone-line","line-color",dark?"#ff5267":"#df3348");
    map.setPaintProperty("jet-zone-line","line-width",zoneWidth);
    map.setPaintProperty("jet-zone-line","line-opacity",dark?.85:.78);
  }
}

async function loadTechzones(){
  try{
    const listResp=await fetch(`${B}/techzones?city_id=${C}`,{cache:"no-store"});
    if(!listResp.ok)throw new Error(`Techzones: HTTP ${listResp.status}`);
    const list=await listResp.json();
    if(!Array.isArray(list))throw new Error("Resposta de Techzones inválida");

    const details=await Promise.all(list.map(async z=>{
      try{
        const r=await fetch(`${B}/techzones/${z.id}`,{cache:"no-store"});
        if(!r.ok)return null;
        const d=await r.json();
        const pts=Array.isArray(d.coordinates)?d.coordinates:[];
        const ring=closeRing(pts.map(p=>[Number(p.lon),Number(p.lat)]).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1])));
        if(ring.length<4)return null;
        return {id:d.id||z.id,name:d.name||z.name||"Zona JET",ring:orientRing(ring,true)};
      }catch(_){return null}
    }));

    const valid=details.filter(Boolean);
    techzoneCount=valid.length;
    techzoneGeoJSON={
      type:"FeatureCollection",
      features:valid.map(z=>({type:"Feature",properties:{id:z.id,name:z.name},geometry:{type:"Polygon",coordinates:[z.ring]}}))
    };
    techzoneMask=buildTechzoneMask(valid.map(z=>z.ring));
    allowedGeometry=techzoneMask?{type:"MultiPolygon",coordinates:techzoneMask.geometry.coordinates.slice(1).map(r=>[orientRing(r,true)])}:null;
    tuneBaseMap(document.body.classList.contains("dark"));
    renderTechzones();
  }catch(e){
    console.warn("Não foi possível carregar as Techzones da JET:",e);
  }
}

async function all(x){
  const page=async i=>{
    const r=await fetch(`${B}/${x}?city_id=${C}&page=${i}&limit=1000`,{cache:"no-store"});
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    return r.json();
  };
  const first=await page(1), entries=[...(first.entries||[])];
  // Consulta as páginas restantes em paralelo (até quatro por vez).
  for(let start=2;start<=Number(first.total_pages);start+=4){
    const numbers=Array.from({length:Math.min(4,Number(first.total_pages)-start+1)},(_,i)=>start+i);
    const pages=await Promise.all(numbers.map(page));
    pages.forEach(p=>entries.push(...(p.entries||[])));
  }
  return entries;
}

function isMonitor(x){
  const v=x && x.monitor;
  return v===true || v===1 || v==="1" || String(v).toLowerCase()==="true";
}

function stat(x){
  const n=+x.bikes_count||0,t=+x.target_bikes_count||0;
  // Fora do monitor é sempre azul, independentemente da quantidade.
  if(!isMonitor(x))return["Fora do monitor","offmonitor"];
  // Prioridade: monitor zerado > 1 patinete > abaixo da meta > meta atingida/superada.
  if(n===0)return["Vazio — prioridade máxima","bad"];
  if(n===1)return["1 patinete — prioridade","orange"];
  if(t>0 && n<t)return["Abaixo da meta","warn"];
  if(t>0 && n>=t)return["Meta atingida","ok"];
  if(n===0)return["Vazio","warn"];
  return["OK","ok"]
}

function clearMarkers(){
  markers.forEach(m=>m.remove());
  markers=[];
}

function render(){
  if(!map || !map.loaded()) return;
  clearMarkers();

  const f=document.getElementById("f").value,q=document.getElementById("q").value.toLowerCase();

  // Não limitar os marcadores aos limites atuais do mapa.
  // Isso evita que pontos desapareçam ao abrir, arrastar ou alterar o zoom.
  // O filtro controla exatamente quais estacionamentos são desenhados.
  const visible=P.filter(x=>{
    let n=+x.bikes_count||0,t=+x.target_bikes_count||0;
    if(q&&!String(x.name).toLowerCase().includes(q))return false;
    if(f=="monitor"&&!isMonitor(x))return false;
    if(f=="monitor-zero"&&!(isMonitor(x)&&n===0))return false;
    if(x.latitude==null||x.longitude==null)return false;
    return true;
  });
  visible.forEach(x=>{
    if(x.latitude==null)return;
    let [st,cl]=stat(x);
    const n=+x.bikes_count||0,t=+x.target_bikes_count||0;
    const color=!isMonitor(x)?"#1677ff":cl==="bad"?"#ff3b30":cl==="orange"?"#ff9500":cl==="warn"?"#ffc857":"#21d19a";
    const el=document.createElement("div");
    el.className="jet-marker";
    el.style.background=color;
    let movementBadge="";
    if(isMonitor(x) && t>0){
      if(n<t) movementBadge=`<span class="move-badge">+${t-n}</span>`;
      else if(n>t) movementBadge=`<span class="move-badge">−${n-t}</span>`;
    }
    el.innerHTML=`<span>${n}</span>${movementBadge}`;
    const lat=Number(x.latitude), lng=Number(x.longitude);
    const googleUrl=`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
    const wazeUrl=`https://waze.com/ul?ll=${lat}%2C${lng}&navigate=yes`;
    const popup=new maplibregl.Popup({offset:16,maxWidth:"330px"}).setHTML(
      `<div class="popup parking-popup">
        <div class="popup-title">${x.name}</div>
        <div class="popup-row">🛴 <b>${x.bikes_count||0}</b> patinetes &nbsp; • &nbsp; 🎯 Meta: <b>${x.target_bikes_count??"—"}</b></div>
        <div class="popup-status ${cl}">${st}</div>
        <div class="popup-update">Última atualização: ${x.bc_updated_at||"—"}</div>
        <div class="popup-nav">
          <a class="nav-btn google" href="${googleUrl}" target="_blank" rel="noopener">🗺️ Google Maps</a>
          <a class="nav-btn waze" href="${wazeUrl}" target="_blank" rel="noopener">🚗 Waze</a>
        </div>
        <button class="parking-guide-btn" type="button" onclick="this.nextElementSibling.classList.toggle('open');this.textContent=this.nextElementSibling.classList.contains('open')?'📷 Ocultar como estacionar':'📷 Como estacionar?'">📷 Como estacionar?</button>
        <div class="parking-guide"><img src="como-estacionar.jpg" alt="Exemplo de como estacionar o patinete"></div>
      </div>`
    );
    const marker=new maplibregl.Marker({element:el,anchor:"center",rotationAlignment:"viewport",pitchAlignment:"viewport",subpixelPositioning:true})
      .setLngLat([x.longitude,x.latitude]).setPopup(popup).addTo(map);
    marker.__parkingId=x.id;
    markers.push(marker);
  });

  let a=P.filter(x=>isMonitor(x)&&((+x.bikes_count||0)==0||((+x.target_bikes_count||0)>0&&(+x.bikes_count||0)<(+x.target_bikes_count||0))))
    .sort((a,b)=>(+a.bikes_count||0)-(+b.bikes_count||0)).slice(0,100);

  document.getElementById("att").innerHTML=a.map(x=>{
    let [st,cl]=stat(x);
    return `<tr><td>${x.name}</td><td>${x.bikes_count||0}</td><td>${x.target_bikes_count??"—"}</td><td class="${cl}">${st}</td></tr>`
  }).join("");

  let l=S.filter(x=>(+x.battery_percent)<.3).sort((a,b)=>a.battery_percent-b.battery_percent).slice(0,100);
  document.getElementById("lb").innerHTML=l.map(x=>
    `<tr><td>${x.identifier||x.name}</td><td class="bad">${Math.round(x.battery_percent*100)}%</td><td>${x.business_status||"—"}</td></tr>`
  ).join("")||"<tr><td colspan=3>Nenhum registro.</td></tr>";
}
function updateUserLocation(pos,center=false){
  const {latitude,longitude,accuracy}=pos.coords;
  const el=userMarker?userMarker.getElement():document.createElement("div");
  if(!userMarker){
    el.className="location-marker";
    userMarker=new maplibregl.Marker({element:el,anchor:"center",rotationAlignment:"map"}).setLngLat([longitude,latitude]).addTo(map);
  }else userMarker.setLngLat([longitude,latitude]);
  const btn=document.getElementById("myLocation");
  if(btn) btn.title=`Minha localização • precisão aproximada ${Math.round(accuracy||0)} m`;
  if(center && map){ map.easeTo({center:[longitude,latitude],zoom:Math.max(map.getZoom(),15),duration:500}); }
}
function locationError(err){
  const btn=document.getElementById("myLocation");
  const msg=err.code===1?"Permita a localização do navegador para acompanhar o auxiliar. Se o navegador bloquear localização em arquivo local, abra o app por HTTPS.":"Não foi possível obter a localização. Toque novamente no botão de localização.";
  if(btn) btn.title=msg;
  const status=document.getElementById("s");
  if(status && !P.length) status.textContent=msg;
}
function requestLocation(center){
  if(!navigator.geolocation){locationError({code:2});return;}
  navigator.geolocation.getCurrentPosition(pos=>{updateUserLocation(pos,center||firstUserFix);firstUserFix=false},locationError,{enableHighAccuracy:true,maximumAge:10000,timeout:10000});
  if(userWatchId===null){
    userWatchId=navigator.geolocation.watchPosition(pos=>{updateUserLocation(pos,false);firstUserFix=false},locationError,{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
  }
}

async function load(){try{
  // O modo operacional padrão é Monitor.
  document.getElementById("f").value="monitor";

  document.getElementById("m").textContent=P.filter(x=>isMonitor(x)).length.toLocaleString("pt-BR");
  render();
  document.getElementById("s").textContent="Mapa carregado — dados de patinetes serão consultados quando necessários.";
}catch(e){document.getElementById("s").textContent="Erro ao consultar a API: "+e.message}}

function bikeFeatures(bikes){
  return {type:"FeatureCollection",features:bikes.flatMap(x=>{
    const rawLat=x.location_lat??x.latitude, rawLng=x.location_lng??x.longitude;
    if(rawLat==null||rawLng==null||rawLat===""||rawLng==="")return [];
    const lat=Number(rawLat),lng=Number(rawLng);
    if(!Number.isFinite(lat)||!Number.isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180||(lat===0&&lng===0))return [];
    return [{type:"Feature",geometry:{type:"Point",coordinates:[lng,lat]},properties:{
      id:String(x.id||""),identifier:String(x.identifier||x.name||"Patinete"),
      battery:x.battery_percent==null?null:Math.round(Number(x.battery_percent)*100),
      status:String(x.business_status||"—"),parkingId:String(x.parking_id||"")
    }}];
  })};
}
function renderScooters(){
  if(!map||!map.isStyleLoaded())return;
  let source=map.getSource("jet-scooters");
  if(!source){
    map.addSource("jet-scooters",{type:"geojson",data:scooterData});
    source=map.getSource("jet-scooters");scooterSourceVersions.set(source,scooterData);
  }else if(scooterSourceVersions.get(source)!==scooterData){
    source.setData(scooterData);scooterSourceVersions.set(source,scooterData);
  }
  if(!map.getLayer("jet-scooter-points"))map.addLayer({
    id:"jet-scooter-points",type:"circle",source:"jet-scooters",
    layout:{visibility:scootersVisible?"visible":"none"},
    paint:{"circle-radius":["interpolate",["linear"],["zoom"],10,2,14,3,18,4.5],
      "circle-color":"#168dcc","circle-opacity":.8,"circle-stroke-width":1,
      "circle-stroke-color":document.body.classList.contains("dark")?"#dcecff":"#ffffff"}
  });
  else map.setLayoutProperty("jet-scooter-points","visibility",scootersVisible?"visible":"none");
}
function updateScooterButton(){
  const btn=document.getElementById("scooterBtn");if(!btn)return;
  btn.setAttribute("aria-pressed",String(scootersVisible));
  btn.textContent=scootersVisible?"🛴 Ocultar patinetes":"🛴 Mostrar patinetes";
  btn.title=bikesLoaded?`${scooterData.features.length} de ${S.length} patinetes com localização válida`:"Mostrar todos os patinetes, inclusive fora dos estacionamentos";
}
function showScooterPopup(e){
  if(!scootersVisible||!e.features||!e.features.length)return;
  const feature=e.features[0],x=feature.properties;
  if(scooterPopup)scooterPopup.remove();
  const box=document.createElement("div");box.className="popup";
  const title=document.createElement("strong");title.textContent="🛴 "+x.identifier;box.appendChild(title);
  const parking=P.find(p=>String(p.id)===x.parkingId);
  const lines=[`Bateria: ${x.battery==null?"—":x.battery+"%"}`,`Status: ${x.status}`,x.parkingId?`Estacionamento: ${parking?parking.name:"Vinculado a estacionamento"}`:"Sem estacionamento vinculado"];
  lines.forEach(text=>{const line=document.createElement("div");line.textContent=text;box.appendChild(line)});
  scooterPopup=new maplibregl.Popup({offset:8,maxWidth:"280px"}).setLngLat(feature.geometry.coordinates).setDOMContent(box).addTo(map);
}
async function loadBikes(force=false){
  if(bikesRequest)return bikesRequest;
  if(bikesLoaded&&!force){renderScooters();return true;}
  bikesRequest=(async()=>{
    try{
      const next=await all("bikes");S=next;bikesLoaded=true;bikesUpdatedAt=Date.now();scooterData=bikeFeatures(S);
      document.getElementById("b").textContent=S.length.toLocaleString("pt-BR");
      const v=S.filter(x=>x.battery_percent!=null).map(x=>Number(x.battery_percent)).filter(Number.isFinite);
      document.getElementById("bat").textContent=v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*100)+"%":"—";
      render();renderScooters();updateScooterButton();return true;
    }catch(e){
      document.getElementById("s").textContent="Erro ao consultar patinetes: "+e.message;
      updateScooterButton();const btn=document.getElementById("scooterBtn");btn.title="Não foi possível atualizar os patinetes. Desative e ative para tentar novamente.";
      return false;
    }
  })();
  try{return await bikesRequest;}finally{bikesRequest=null;}
}
